<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="art-title art-desc">
<title id="art-title">榉木牙刷刷头细节插画</title>
<desc id="art-desc">木质牙刷柄、螺纹连接处与细密刷毛的近景，晨光在木纹和白色刷丝上留下柔和高光。</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2=".72" y2="1">
      <stop offset="0" stop-color="#b5bfae"/><stop offset="1" stop-color="#ded6c4"/>
    </linearGradient>
    <radialGradient id="light" gradientUnits="userSpaceOnUse" cx="260" cy="160" r="760">
      <stop offset="0" stop-color="#fff7e7" stop-opacity=".82"/>
      <stop offset=".52" stop-color="#fff5e3" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff5e3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" gradientUnits="userSpaceOnUse" cx="600" cy="410" r="760">
      <stop offset=".55" stop-color="#2d2117" stop-opacity="0"/>
      <stop offset="1" stop-color="#2d2117" stop-opacity=".24"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="2" seed="16" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .11"/></feComponentTransfer>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="soft-s" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="11"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#3c2a1d" flood-opacity=".26"/>
    </filter>
    <filter id="shadow-lg" x="-40%" y="-40%" width="190%" height="200%">
      <feDropShadow dx="0" dy="28" stdDeviation="26" flood-color="#312116" flood-opacity=".3"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>


<linearGradient id="brushBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#aab7a6"/><stop offset=".5" stop-color="#c9cec0"/><stop offset="1" stop-color="#e7dfd0"/></linearGradient>
<linearGradient id="woodMacro" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#cbb088"/><stop offset=".45" stop-color="#b08e64"/><stop offset="1" stop-color="#80603f"/></linearGradient>
<pattern id="beechGrain" width="40" height="26" patternUnits="userSpaceOnUse">
  <path d="M0 7 C12 2 24 12 40 5 M0 19 C14 14 28 23 40 17" stroke="#6e5237" stroke-opacity=".14" stroke-width="1.5" fill="none"/>
  <circle cx="16" cy="22" r="1" fill="#6e5237" opacity=".18"/>
</pattern>

</defs>
<rect width="1200" height="900" fill="url(#bg)"/>
<rect width="1200" height="900" fill="url(#light)"/>

<rect width="1200" height="900" fill="url(#brushBg)"/>
<path d="M0 0 L520 0 L168 900 L0 900Z" fill="#fff3dd" opacity=".15" filter="url(#soft-s)"/>
<g transform="rotate(-31 600 450)" filter="url(#shadow-lg)">
  <path d="M-40 300 C260 236 670 260 1110 342 L1110 492 C690 416 282 394 -40 450Z" fill="url(#woodMacro)" stroke="#5f4b35" stroke-opacity=".4" stroke-width="3"/>
  <path d="M798 290 L1096 330 L1096 426 L800 390Z" fill="#d8d3c7" stroke="#777366" stroke-opacity=".32" stroke-width="2"/>
  <g stroke="#ede8dc" stroke-opacity=".86" stroke-width="3" stroke-linecap="round">
    <path d="M836 288 L820 214 M856 292 L842 216 M876 295 L864 218 M896 298 L884 220 M916 302 L906 222 M936 305 L926 225 M956 308 L948 228 M976 311 L970 231 M996 314 L992 234"/>
    <path d="M846 292 L832 232 M866 295 L854 232 M886 298 L876 234 M906 300 L896 236 M926 303 L918 238 M946 306 L940 240 M966 309 L960 242 M986 312 L982 244"/>
  </g>
  <g fill="#f7f3e8" opacity=".85">
    <circle cx="820" cy="210" r="4"/><circle cx="846" cy="213" r="4"/><circle cx="872" cy="216" r="4"/><circle cx="900" cy="219" r="4"/><circle cx="928" cy="223" r="4"/><circle cx="956" cy="227" r="4"/><circle cx="984" cy="232" r="4"/>
  </g>
  <path d="M760 282 C794 270 842 270 882 288" fill="none" stroke="#6e5c43" stroke-opacity=".35" stroke-width="6"/>
  <g stroke="#5f4a34" stroke-opacity=".28" stroke-width="2">
    <path d="M200 342 C430 306 696 316 934 354"/>
    <path d="M192 372 C416 336 694 346 936 382"/>
    <path d="M182 406 C424 370 700 380 944 414"/>
  </g>
  <g fill="none" stroke="#f2ead9" stroke-opacity=".2" stroke-width="5">
    <path d="M-6 322 C272 276 628 296 1000 364"/>
  </g>
  <g transform="translate(350,380)">
    <path d="M0 0 C14 18 16 34 4 48 C-16 38 -22 20 0 0Z" fill="#aab7a6" opacity=".7"/>
    <ellipse cx="56" cy="-12" rx="34" ry="14" fill="#aab7a6" opacity=".5"/>
  </g>
</g>
<g transform="translate(86,672)">
  <path d="M0 68 C226 20 488 22 714 66 C756 80 742 124 700 142 C508 184 238 180 52 142 C12 126 -18 94 0 68Z" fill="#d5cec0" opacity=".7"/>
  <ellipse cx="360" cy="100" rx="300" ry="56" fill="#c2b9a9" opacity=".38"/>
</g>
<g stroke="#f7eee0" stroke-width="2" opacity=".22" fill="none">
  <path d="M100 120 C232 80 348 84 454 118 M794 802 C904 774 1006 782 1110 814"/>
</g>
<g fill="#fff6e9" opacity=".3">
  <circle cx="1006" cy="188" r="3"/><circle cx="938" cy="730" r="2"/><circle cx="742" cy="136" r="2.4"/>
</g>
<rect width="1200" height="900" fill="url(#beechGrain)" opacity=".55"/>
<rect width="1200" height="900" fill="url(#vignette)" opacity="0.43"/>
<rect width="1200" height="900" filter="url(#grain)" opacity="0.46"/>
</svg>
