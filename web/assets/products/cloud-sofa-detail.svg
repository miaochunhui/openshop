  <path d="M210 330 C360 280 580 280 760 350 C620 430 380 440 210 330Z" fill="#eee5d8" opacity=".8"/>
  <path d="M300 300 C400 340 520 350 630 325" stroke="#b9a288" fill="none" stroke-width="3" opacity=".55"/>
  <path d="M340 400 C420 370 510 380 610 430" stroke="#c7b49e" fill="none" stroke-width="3" opacity=".45"/>
</g>
<g opacity=".55" stroke="#f7efe2" stroke-width="2">
  <path d="M120 770 C260 690 450 800 610 720 C780 635 930 720 1080 650"/>
  <path d="M120 800 C300 720 430 825 620 750 C820 670 950 750 1080 690"/>
</g>
<circle cx="1020" cy="180" r="110" fill="#d6a55f" opacity=".45"/>
<path d="M740 720 l70 0 l35 75 l-140 0z" fill="#8f7458" opacity=".55"/>

<rect width="1200" height="900" filter="url(#grain)" opacity=".5"/>
</svg>
