<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="art-title art-desc">
<title id="art-title">云朵模块沙发客厅插画</title>
<desc id="art-desc">米白色模块沙发、砖红靠枕、窗光与一盏纸灯组成的温暖客厅。</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2=".72" y2="1">
      <stop offset="0" stop-color="#eadcc7"/><stop offset="1" stop-color="#bfa17c"/>
    </linearGradient>
    <radialGradient id="light" gradientUnits="userSpaceOnUse" cx="230" cy="220" r="820">
      <stop offset="0" stop-color="#fff7e7" stop-opacity=".82"/>
      <stop offset=".52" stop-color="#fff5e3" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff5e3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" gradientUnits="userSpaceOnUse" cx="600" cy="410" r="760">
      <stop offset=".55" stop-color="#2d2117" stop-opacity="0"/>
      <stop offset="1" stop-color="#2d2117" stop-opacity=".24"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="2" seed="11" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .11"/></feComponentTransfer>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="soft-s" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="11"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#3c2a1d" flood-opacity=".26"/>
    </filter>
    <filter id="shadow-lg" x="-40%" y="-40%" width="190%" height="200%">
      <feDropShadow dx="0" dy="28" stdDeviation="26" flood-color="#312116" flood-opacity=".3"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>


<linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#cfb393"/><stop offset="1" stop-color="#ad8c69"/></linearGradient>
<linearGradient id="windowSky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4ead8"/><stop offset="1" stop-color="#d6bd9c"/></linearGradient>
<linearGradient id="rug" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f1e7d9"/><stop offset="1" stop-color="#dfcdb8"/></linearGradient>
<linearGradient id="tableWood" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#b18a61"/><stop offset=".55" stop-color="#9a704f"/><stop offset="1" stop-color="#c29d72"/></linearGradient>
<linearGradient id="lampshade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#eed9b1"/><stop offset="1" stop-color="#d4b47f"/></linearGradient>
<linearGradient id="sofaBase" x1="0" y1="0" x2=".35" y2="1"><stop stop-color="#efe6d9"/><stop offset=".65" stop-color="#e0d2c0"/><stop offset="1" stop-color="#d2c0ab"/></linearGradient>
<linearGradient id="cushionA" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#f4ece1"/><stop offset=".7" stop-color="#e5d8c7"/><stop offset="1" stop-color="#d8c7b3"/></linearGradient>
<linearGradient id="cushionB" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#f2e9de"/><stop offset=".7" stop-color="#e4d6c4"/><stop offset="1" stop-color="#d9c8b4"/></linearGradient>
<linearGradient id="armGrad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0e6d8"/><stop offset=".7" stop-color="#dfd0be"/><stop offset="1" stop-color="#cdb8a0"/></linearGradient>
<linearGradient id="seatGrad" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f1e8da"/><stop offset="1" stop-color="#dfd0bd"/></linearGradient>
<linearGradient id="pillowGrad" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#c78363"/><stop offset="1" stop-color="#a95c43"/></linearGradient>
<linearGradient id="throwGrad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c19768"/><stop offset="1" stop-color="#a97d52"/></linearGradient>
<pattern id="boucle" width="19" height="19" patternUnits="userSpaceOnUse">
  <circle cx="4" cy="5" r="1.3" fill="#fffaf0" opacity=".4"/>
  <circle cx="13" cy="11" r="1.8" fill="#8e7a63" opacity=".08"/>
  <path d="M8 4 C11 6 12 9 10 12 M2 15 C5 13 8 15 10 18" stroke="#8e7a63" stroke-opacity=".14" stroke-width="1.2" fill="none"/>
  <path d="M15 2 C17 4 17 6 16 8" stroke="#fffaf0" stroke-opacity=".3" stroke-width="1" fill="none"/>
</pattern>

</defs>
