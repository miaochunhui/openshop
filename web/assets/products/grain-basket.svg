<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="art-title art-desc">
<title id="art-title">芦编收纳筐玄关插画</title>
<desc id="art-desc">木凳前的两只蒲草收纳筐，一只叠着条纹织物与棉布内衬，晨光在编织纹理上落下深浅层次。</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2=".72" y2="1">
      <stop offset="0" stop-color="#e7ddcd"/><stop offset="1" stop-color="#bfae96"/>
    </linearGradient>
    <radialGradient id="light" gradientUnits="userSpaceOnUse" cx="230" cy="190" r="770">
      <stop offset="0" stop-color="#fff7e7" stop-opacity=".82"/>
      <stop offset=".52" stop-color="#fff5e3" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff5e3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" gradientUnits="userSpaceOnUse" cx="600" cy="410" r="760">
      <stop offset=".55" stop-color="#2d2117" stop-opacity="0"/>
      <stop offset="1" stop-color="#2d2117" stop-opacity=".24"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="2" seed="23" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .11"/></feComponentTransfer>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="soft-s" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="11"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#3c2a1d" flood-opacity=".26"/>
    </filter>
    <filter id="shadow-lg" x="-40%" y="-40%" width="190%" height="200%">
      <feDropShadow dx="0" dy="28" stdDeviation="26" flood-color="#312116" flood-opacity=".3"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>


<linearGradient id="basketFloor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#c8b79f"/><stop offset="1" stop-color="#a99176"/></linearGradient>
<linearGradient id="benchWood" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a4815b"/><stop offset="1" stop-color="#866646"/></linearGradient>
<linearGradient id="hatGrad" x1="0" y1="0" x2=".5" y2="1"><stop stop-color="#dac2a0"/><stop offset="1" stop-color="#b18d67"/></linearGradient>
<linearGradient id="basketWoven" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#c7a678"/><stop offset=".55" stop-color="#b28e62"/><stop offset="1" stop-color="#8f6f4c"/></linearGradient>
<linearGradient id="blanketGrad" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d3bc9b"/><stop offset=".6" stop-color="#b89c78"/><stop offset="1" stop-color="#8d7357"/></linearGradient>
<pattern id="strawHatch" width="22" height="18" patternUnits="userSpaceOnUse">
