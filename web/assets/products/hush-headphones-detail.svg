<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#253b32"/><stop offset="1" stop-color="#4d6a5a"/></linearGradient>
  <radialGradient id="glow" cx="50%" cy="32%" r="70%"><stop stop-color="#fff7e8" stop-opacity=".95"/><stop offset="1" stop-color="#fff7e8" stop-opacity="0"/></radialGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
  <filter id="shadow"><feDropShadow dx="0" dy="26" stdDeviation="22" flood-color="#5b3c25" flood-opacity=".23"/></filter>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .09"/></feComponentTransfer></filter>
</defs>
<rect width="1200" height="900" fill="url(#bg)"/>
<ellipse cx="600" cy="300" rx="620" ry="430" fill="url(#glow)"/>

<g transform="translate(120,60)">
  <g filter="url(#shadow)">
    <rect x="120" y="120" width="680" height="620" rx="220" transform="rotate(-12 460 430)" fill="#172a23"/>
    <rect x="185" y="190" width="540" height="480" rx="185" transform="rotate(-12 460 430)" fill="#2b463c"/>
    <rect x="235" y="240" width="430" height="350" rx="160" transform="rotate(-12 460 430)" fill="#527466" opacity=".72"/>
    <path d="M300 520 C390 430 540 410 670 460" stroke="#8aa797" stroke-width="4" fill="none" opacity=".55" transform="rotate(-12 460 430)"/>
    <path d="M650 260 L900 120" stroke="#1a2e26" stroke-width="80" stroke-linecap="round"/>
    <path d="M695 235 L890 130" stroke="#708f7c" stroke-width="10" stroke-linecap="round" opacity=".5"/>
    <circle cx="900" cy="120" r="54" fill="#203a30"/>
  </g>
</g>
<circle cx="990" cy="680" r="100" fill="#c7a35e" opacity=".18"/>
<path d="M170 220 C270 160 300 100 460 80" stroke="#d8cfbb" stroke-width="2" opacity=".3" fill="none"/>

<rect width="1200" height="900" filter="url(#grain)" opacity=".5"/>
</svg>
