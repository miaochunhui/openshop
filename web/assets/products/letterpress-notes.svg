  <path d="M0 22 L280 0 L296 16 L18 46Z" fill="#c3a273"/>
  <path d="M280 0 L318 -10 L330 2 L296 16Z" fill="#6f5137"/>
  <ellipse cx="0" cy="22" rx="11" ry="26" fill="#967049"/>
</g>
<g transform="translate(1008,120) rotate(22)">
  <path d="M0 164 C22 104 20 52 72 0" fill="none" stroke="#776a51" stroke-width="3"/>
  <ellipse cx="28" cy="86" rx="34" ry="10" transform="rotate(-34 28 86)" fill="#8c8a6d"/>
  <ellipse cx="46" cy="34" rx="28" ry="8" transform="rotate(24 46 34)" fill="#777b5f"/>
</g>
<g fill="#fff8ea" opacity=".28">
  <circle cx="1042" cy="268" r="3"/><circle cx="94" cy="206" r="2"/><circle cx="700" cy="802" r="2.4"/>
</g>
<rect width="1200" height="900" fill="url(#cotton)" opacity=".55"/>
<rect width="1200" height="900" fill="url(#vignette)" opacity="0.47"/>
<rect width="1200" height="900" filter="url(#grain)" opacity="0.46"/>
</svg>
