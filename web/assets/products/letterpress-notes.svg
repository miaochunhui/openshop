  <g transform="translate(46,42)" fill="none" stroke="#bcab93" stroke-opacity=".5" stroke-width="2.4">
    <path d="M4 128 C20 64 64 16 132 4 C202 -8 244 32 238 100 C234 158 176 184 106 178 C54 174 18 156 4 128Z"/>
    <path d="M132 4 C120 58 118 118 130 170"/>
    <path d="M62 94 C94 66 128 70 152 94 C130 120 94 122 62 94Z"/>
    <path d="M172 108 C202 86 228 94 244 114 C222 134 192 134 172 108Z"/>
  </g>
  <path d="M38 28 C138 18 248 20 296 32" fill="none" stroke="#fffbf2" stroke-opacity=".4" stroke-width="2"/>
</g>
<g transform="translate(818,426)" filter="url(#shadow)">
  <ellipse cx="108" cy="122" rx="116" ry="37" fill="#b19c82" opacity=".38"/>
  <path d="M12 98 L60 20 H164 L214 98 C232 112 228 142 206 166 C160 194 68 194 22 168 C0 150 -4 118 12 98Z" fill="#f1e7d8" stroke="#a18b70" stroke-opacity=".3" stroke-width="2"/>
  <path d="M60 20 C96 50 136 52 164 20 M64 20 L74 178 M164 20 L152 178" fill="none" stroke="#c4b39c" stroke-opacity=".4" stroke-width="2"/>
  <circle cx="112" cy="108" r="52" fill="url(#wax)" stroke="#87402f" stroke-opacity=".4" stroke-width="3"/>
  <path d="M78 104 L112 80 L146 104 L130 136 L94 136Z" fill="none" stroke="#e8b7a1" stroke-opacity=".4" stroke-width="2"/>
