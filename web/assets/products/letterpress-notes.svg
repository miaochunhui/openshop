      <path d="M206 200 C258 174 318 190 344 234 C294 258 238 252 206 200Z"/>
      <path d="M230 300 C288 272 354 290 378 338 C324 362 264 352 230 300Z"/>
      <path d="M182 386 C236 362 292 378 316 424 C266 446 212 438 182 386Z"/>
      <path d="M126 262 C96 214 112 164 156 142 C170 194 154 236 126 262Z"/>
      <path d="M142 372 C104 332 108 282 142 252 C168 294 164 340 142 372Z"/>
    </g>
    <g fill="none" stroke="#cfbea6" stroke-opacity=".3" stroke-width="2">
      <path d="M222 216 C264 200 304 204 330 226 M248 314 C290 298 336 306 358 332 M196 402 C238 386 282 394 304 418"/>
    </g>
    <g fill="none" stroke="#9d8b74" stroke-opacity=".25" stroke-width="2">
      <path d="M198 148 C204 268 188 398 158 506 M214 158 C230 274 222 388 192 496"/>
    </g>
    <path d="M-34 470 C54 454 146 458 238 474 C330 492 404 522 446 560" fill="none" stroke="#c2af96" stroke-opacity=".3" stroke-width="2"/>
    <path d="M56 548 C156 512 284 512 362 546" fill="none" stroke="#ded1c0" stroke-opacity=".5" stroke-width="3"/>
  </g>
  <path d="M30 28 C172 10 348 12 530 30 L532 612 C384 634 170 634 28 610Z" fill="none" stroke="#fffbf3" stroke-opacity=".35" stroke-width="3"/>
</g>
<g transform="translate(132,498) rotate(11)" filter="url(#shadow)">
