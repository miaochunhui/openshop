</g>
<path d="M0 0 L440 0 L136 900 L0 900Z" fill="#fff6e8" opacity=".15" filter="url(#soft-s)"/>
<ellipse cx="806" cy="602" rx="400" ry="54" fill="#5d4430" opacity=".15" filter="url(#soft)"/>
<g transform="translate(750,90) rotate(8)" filter="url(#shadow)">
  <path d="M0 78 L316 0 L486 48 L166 144Z" fill="#e7d9c5" stroke="#8e7960" stroke-opacity=".3" stroke-width="2"/>
  <path d="M0 78 L186 104 L166 144 M486 48 L270 114 L316 0" fill="none" stroke="#b5a083" stroke-opacity=".4" stroke-width="2"/>
