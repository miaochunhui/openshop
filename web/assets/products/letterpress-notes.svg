<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="art-title art-desc">
<title id="art-title">活版花笺信纸桌面插画</title>
<desc id="art-desc">亚麻桌面上摊开的活版压花信纸、信封、火漆印章与黄铜拆信刀，纸面留着可触摸的凹痕。</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2=".72" y2="1">
      <stop offset="0" stop-color="#e5d7c5"/><stop offset="1" stop-color="#bda68b"/>
    </linearGradient>
    <radialGradient id="light" gradientUnits="userSpaceOnUse" cx="240" cy="170" r="770">
      <stop offset="0" stop-color="#fff7e7" stop-opacity=".82"/>
      <stop offset=".52" stop-color="#fff5e3" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff5e3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" gradientUnits="userSpaceOnUse" cx="600" cy="410" r="760">
      <stop offset=".55" stop-color="#2d2117" stop-opacity="0"/>
      <stop offset="1" stop-color="#2d2117" stop-opacity=".24"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="2" seed="66" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .11"/></feComponentTransfer>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="soft-s" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="11"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#3c2a1d" flood-opacity=".26"/>
    </filter>
    <filter id="shadow-lg" x="-40%" y="-40%" width="190%" height="200%">
      <feDropShadow dx="0" dy="28" stdDeviation="26" flood-color="#312116" flood-opacity=".3"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>


<linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dfd0bd"/><stop offset=".55" stop-color="#cdbba5"/><stop offset="1" stop-color="#b29d83"/></linearGradient>
<linearGradient id="linen" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#f1e9dc"/><stop offset="1" stop-color="#dfd0bc"/></linearGradient>
<radialGradient id="wax" cx=".36" cy=".3" r=".8"><stop stop-color="#b35b45"/><stop offset=".7" stop-color="#8e4230"/><stop offset="1" stop-color="#6b3023"/></radialGradient>
<pattern id="cotton" width="22" height="20" patternUnits="userSpaceOnUse">
  <path d="M0 6 H22 M0 14 H22" stroke="#a68f73" stroke-opacity=".1" stroke-width="1"/>
  <path d="M6 0 V20 M16 0 V20" stroke="#fffaf0" stroke-opacity=".14" stroke-width="1"/>
  <path d="M3 3 C6 1 9 5 13 3" stroke="#9f876b" stroke-opacity=".1" stroke-width="0.8" fill="none"/>
</pattern>

</defs>
<rect width="1200" height="900" fill="url(#bg)"/>
<rect width="1200" height="900" fill="url(#light)"/>

<path d="M0 0 H1200 V900 H0Z" fill="url(#surface)"/>
<path d="M0 0 L1200 0 L1200 900 L0 900Z" fill="url(#linen)"/>
<g opacity=".32" stroke="#a28b72" stroke-width="2">
  <path d="M0 160 C220 134 386 166 578 140 C776 114 990 152 1200 126"/>
  <path d="M0 320 C198 292 398 326 606 298 C810 270 1012 302 1200 274"/>
