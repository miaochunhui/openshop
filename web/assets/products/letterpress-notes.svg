    <path d="M80 498 C52 356 82 230 194 132 C296 44 398 108 402 232 C408 360 318 480 168 520 C132 530 102 520 80 498Z" fill="none" stroke="#b7a58c" stroke-opacity=".48" stroke-width="3"/>
