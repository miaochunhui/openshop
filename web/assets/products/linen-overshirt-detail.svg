<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="art-title art-desc">
<title id="art-title">亚麻罩衫面料与口袋细节插画</title>
<desc id="art-desc">亚麻罩衫胸前的贴袋与木纽扣近景，布料纹理和斜向光里的褶皱清晰可辨。</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2=".72" y2="1">
      <stop offset="0" stop-color="#d9c8b2"/><stop offset="1" stop-color="#9c836a"/>
    </linearGradient>
    <radialGradient id="light" gradientUnits="userSpaceOnUse" cx="280" cy="180" r="760">
      <stop offset="0" stop-color="#fff7e7" stop-opacity=".82"/>
      <stop offset=".52" stop-color="#fff5e3" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff5e3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" gradientUnits="userSpaceOnUse" cx="600" cy="410" r="760">
      <stop offset=".55" stop-color="#2d2117" stop-opacity="0"/>
      <stop offset="1" stop-color="#2d2117" stop-opacity=".24"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="2" seed="9" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .11"/></feComponentTransfer>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="soft-s" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="11"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#3c2a1d" flood-opacity=".26"/>
    </filter>
    <filter id="shadow-lg" x="-40%" y="-40%" width="190%" height="200%">
      <feDropShadow dx="0" dy="28" stdDeviation="26" flood-color="#312116" flood-opacity=".3"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>


<linearGradient id="fabricBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e2d3bf"/><stop offset=".55" stop-color="#cbb69d"/><stop offset="1" stop-color="#9e856b"/></linearGradient>
<linearGradient id="fabricBig" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#f7f0e5"/><stop offset=".6" stop-color="#ebe0d2"/><stop offset="1" stop-color="#d2c1ad"/></linearGradient>
<radialGradient id="buttonWood" cx=".35" cy=".3" r=".8"><stop stop-color="#c8a87d"/><stop offset=".7" stop-color="#9d7a52"/><stop offset="1" stop-color="#6a4e34"/></radialGradient>
<pattern id="fabricWeave" width="16" height="16" patternUnits="userSpaceOnUse">
  <path d="M0 5 H16 M0 12 H16" stroke="#a28b70" stroke-opacity=".11" stroke-width="1"/>
  <path d="M6 0 V16 M12 0 V16" stroke="#fffaf0" stroke-opacity=".15" stroke-width="1"/>
</pattern>

</defs>
<rect width="1200" height="900" fill="url(#bg)"/>
<rect width="1200" height="900" fill="url(#light)"/>

<rect width="1200" height="900" fill="url(#fabricBg)"/>
<path d="M0 0 L530 0 L192 900 L0 900Z" fill="#fff3dd" opacity=".14" filter="url(#soft-s)"/>
<g transform="rotate(-8 600 450)" filter="url(#shadow-lg)">
  <path d="M-80 150 C230 80 620 80 1030 150 C1190 180 1260 330 1230 570 C1240 760 1110 880 840 900 L-80 900Z" fill="url(#fabricBig)" stroke="#a08b73" stroke-opacity=".32" stroke-width="3"/>
  <path d="M-80 300 C190 246 550 252 900 306 C1080 334 1200 404 1260 484" fill="none" stroke="#b8a58c" stroke-opacity=".34" stroke-width="4"/>
  <path d="M-40 238 C250 196 620 202 970 268" fill="none" stroke="#fff9ee" stroke-opacity=".28" stroke-width="7" stroke-linecap="round"/>
  <path d="M150 540 C284 474 498 466 696 524 C756 542 792 574 798 604 C670 650 386 650 150 612Z" fill="#f7efe4" stroke="#9e8971" stroke-opacity=".3" stroke-width="3"/>
  <path d="M164 564 C322 516 614 518 778 568" fill="none" stroke="#b19d83" stroke-opacity=".45" stroke-width="2" stroke-dasharray="4 8"/>
  <path d="M190 590 C324 554 624 556 760 594" fill="none" stroke="#fffaf1" stroke-opacity=".28" stroke-width="3"/>
  <path d="M760 540 C800 574 808 620 790 662" fill="none" stroke="#ae9980" stroke-opacity=".35" stroke-width="2"/>
  <path d="M458 428 C550 390 672 394 760 440" fill="none" stroke="#fff9ee" stroke-opacity=".22" stroke-width="12" filter="url(#soft-s)"/>
</g>
<g transform="translate(736,118)" filter="url(#shadow)">
  <circle cx="120" cy="120" r="106" fill="url(#buttonWood)" stroke="#6f563c" stroke-opacity=".5" stroke-width="3"/>
  <circle cx="120" cy="120" r="92" fill="none" stroke="#d2b386" stroke-opacity=".35" stroke-width="3"/>
  <path d="M74 120 C90 100 114 92 140 98 C158 102 172 112 178 126" fill="none" stroke="#f3ddb5" stroke-opacity=".24" stroke-width="4"/>
  <circle cx="92" cy="88" r="5" fill="#5f4a34" opacity=".55"/>
  <circle cx="148" cy="154" r="5" fill="#5f4a34" opacity=".45"/>
  <g stroke="#80674b" stroke-width="3" opacity=".6">
    <path d="M62 120 L80 120 M62 130 L80 130 M62 140 L80 140
             M62 150 L80 150"/>
  </g>
</g>
<g transform="translate(60,690) rotate(4)">
  <path d="M0 0 H320" stroke="#8b7054" stroke-width="3"/>
  <path d="M16 0 C140 22 256 18 316 -2" stroke="#f3e4ce" stroke-opacity=".2" stroke-width="4" fill="none"/>
</g>
<g fill="#fff7e9" opacity=".25">
  <circle cx="1020" cy="210" r="3"/><circle cx="956" cy="742" r="2.4"/><circle cx="820" cy="804" r="2"/>
</g>
<rect width="1200" height="900" fill="url(#fabricWeave)" opacity=".55"/>
<rect width="1200" height="900" fill="url(#vignette)" opacity="0.46"/>
<rect width="1200" height="900" filter="url(#grain)" opacity="0.47"/>
</svg>
