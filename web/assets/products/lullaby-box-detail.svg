<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="art-title art-desc">
<title id="art-title">八音盒黄铜机芯细节插画</title>
<desc id="art-desc">八音盒内部的黄铜音梳与滚筒近景，细细的金属齿、木盒内衬与暖光共同构成机械的质感。</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2=".72" y2="1">
      <stop offset="0" stop-color="#3d3125"/><stop offset="1" stop-color="#a28460"/>
    </linearGradient>
    <radialGradient id="light" gradientUnits="userSpaceOnUse" cx="300" cy="150" r="760">
      <stop offset="0" stop-color="#fff7e7" stop-opacity=".82"/>
      <stop offset=".52" stop-color="#fff5e3" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff5e3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" gradientUnits="userSpaceOnUse" cx="600" cy="410" r="760">
      <stop offset=".55" stop-color="#2d2117" stop-opacity="0"/>
      <stop offset="1" stop-color="#2d2117" stop-opacity=".24"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="2" seed="30" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .11"/></feComponentTransfer>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="soft-s" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="11"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#3c2a1d" flood-opacity=".26"/>
    </filter>
    <filter id="shadow-lg" x="-40%" y="-40%" width="190%" height="200%">
      <feDropShadow dx="0" dy="28" stdDeviation="26" flood-color="#312116" flood-opacity=".3"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>


<linearGradient id="darkStudy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#231d16"/><stop offset=".48" stop-color="#5f4b35"/><stop offset="1" stop-color="#a78760"/></linearGradient>
<linearGradient id="woodCase" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#b58a59"/><stop offset=".5" stop-color="#956d45"/><stop offset="1" stop-color="#705034"/></linearGradient>
<radialGradient id="brassBed" cx=".4" cy=".35" r=".8"><stop stop-color="#c9a365"/><stop offset=".6" stop-color="#a77e4a"/><stop offset="1" stop-color="#785835"/></radialGradient>
<pattern id="woodFine" width="48" height="18" patternUnits="userSpaceOnUse">
  <path d="M0 6 C14 1 28 9 48 4 M0 14 C16 9 30 17 48 12" stroke="#3f2c1d" stroke-opacity=".15" stroke-width="1.4" fill="none"/>
</pattern>

</defs>
<rect width="1200" height="900" fill="url(#bg)"/>
<rect width="1200" height="900" fill="url(#light)"/>

<rect width="1200" height="900" fill="url(#darkStudy)"/>
<ellipse cx="330" cy="200" rx="400" ry="300" fill="#e0af69" opacity=".22" filter="url(#glow)"/>
<g transform="rotate(5 600 450)" filter="url(#shadow-lg)">
  <path d="M-90 142 C216 104 730 102 1028 142 C1154 158 1226 230 1236 326 L1236 836 C844 890 238 884 -90 834Z" fill="url(#woodCase)" stroke="#4b3422" stroke-opacity=".5" stroke-width="4"/>
  <path d="M-40 190 C290 156 708 154 1010 190" fill="none" stroke="#e8d0a8" stroke-opacity=".18" stroke-width="5"/>
  <path d="M-40 300 C300 270 740 268 1080 304" fill="none" stroke="#5c422b" stroke-opacity=".28" stroke-width="4"/>
  <g transform="rotate(-7 560 460)">
    <rect x="160" y="300" width="840" height="320" rx="22" fill="#453426" stroke="#2d2117" stroke-width="3"/>
    <rect x="184" y="322" width="792" height="276" rx="16" fill="url(#brassBed)" stroke="#60462b" stroke-opacity=".4" stroke-width="2"/>
    <g transform="translate(256,366)">
      <rect x="0" y="0" width="318" height="116" rx="58" fill="#bd9359" stroke="#5b4327" stroke-opacity=".45" stroke-width="3"/>
      <g stroke="#e0ba7c" stroke-width="3" opacity=".8">
        <path d="M24 18 V98 M44 14 V102 M64 20 V96 M84 16 V100 M104 22 V94 M124 18 V98 M144 24 V92 M164 20 V96 M184 26 V90 M204 22 V94 M224 30 V86 M244 26 V90 M264 34 V82 M284 30 V86"/>
      </g>
      <circle cx="72" cy="58" r="14" fill="#a6793f"/>
      <circle cx="72" cy="58" r="5" fill="#594128"/>
      <circle cx="212" cy="58" r="14" fill="#a6793f"/>
      <circle cx="212" cy="58" r="5" fill="#594128"/>
      <path d="M38 58 H292" stroke="#eed29f" stroke-opacity=".35" stroke-width="2"/>
    </g>
    <g transform="translate(650,342)">
      <rect x="0" y="0" width="230" height="232" rx="18" fill="#59422d" stroke="#342519" stroke-width="2"/>
      <g stroke="#e5c383" stroke-width="4">
        <path d="M36 34 V196 M66 24 V206 M96 30 V200 M126 20 V210 M156 34 V196 M186 26 V204 M216 36 V194"/>
      </g>
      <g fill="none" stroke="#a67c44" stroke-width="3">
        <path d="M12 52 C62 20 160 22 218 54 M12 118 C74 90 174 92 218 122 M12 188 C66 162 158 162 218 190"/>
      </g>
      <circle cx="188" cy="80" r="8" fill="#d3aa6e" opacity=".8"/>
      <circle cx="188" cy="118" r="16" fill="#b68b50"/>
      <circle cx="188" cy="118" r="6" fill="#4d3a26"/>
    </g>
    <g stroke="#e3bf82" stroke-width="4" fill="none">
      <path d="M236 430 C396 452 622 452 800 428"/>
      <path d="M250 466 C410 486 614 486 790 462"/>
    </g>
    <path d="M184 514 C416 536 780 532 976 508" fill="none" stroke="#8f6c46" stroke-opacity=".3" stroke-width="3"/>
  </g>
  <g transform="translate(1048,652)">
    <circle cx="0" cy="0" r="54" fill="#b88c53" stroke="#5c4228" stroke-width="3"/>
    <circle cx="0" cy="0" r="18" fill="#6c5032"/>
    <path d="M38 12 C78 36 66 98 22 116" fill="none" stroke="#b4874f" stroke-width="20" stroke-linecap="round"/>
    <path d="M32 18 C62 42 56 86 28 102" fill="none" stroke="#e0bd82" stroke-opacity=".4" stroke-width="4" stroke-linecap="round"/>
  </g>
</g>
<g transform="translate(48,770) rotate(3)">
  <path d="M0 0 H332" stroke="#4d3824" stroke-width="4"/>
  <path d="M14 0 C128 18 244 14 312 -2" stroke="#e4cda6" stroke-opacity=".16" stroke-width="3" fill="none"/>
</g>
<g fill="#f4dfb7" opacity=".36">
  <circle cx="966" cy="152" r="3"/><circle cx="1020" cy="252" r="2"/><circle cx="102" cy="712" r="2.4"/>
</g>
<g stroke="#f2d9ad" stroke-width="2" opacity=".13" fill="none">
  <path d="M82 96 C218 58 352 64 464 96 M818 842 C934 810 1044 816 1142 848"/>
</g>
<rect width="1200" height="900" fill="url(#woodFine)" opacity=".5"/>
<rect width="1200" height="900" fill="url(#vignette)" opacity="0.55"/>
<rect width="1200" height="900" filter="url(#grain)" opacity="0.4"/>
</svg>
