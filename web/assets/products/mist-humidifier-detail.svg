<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="art-title art-desc">
<title id="art-title">加湿器木盖与水面细节插画</title>
<desc id="art-desc">打开的加湿器近景，木盖斜倚在旁，水面和滤芯在暖灯下泛着微光，细白水汽从陶口升起。</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2=".72" y2="1">
      <stop offset="0" stop-color="#394238"/><stop offset="1" stop-color="#b69a77"/>
    </linearGradient>
    <radialGradient id="light" gradientUnits="userSpaceOnUse" cx="940" cy="220" r="680">
      <stop offset="0" stop-color="#fff7e7" stop-opacity=".82"/>
      <stop offset=".52" stop-color="#fff5e3" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff5e3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" gradientUnits="userSpaceOnUse" cx="600" cy="410" r="760">
      <stop offset=".55" stop-color="#2d2117" stop-opacity="0"/>
      <stop offset="1" stop-color="#2d2117" stop-opacity=".24"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="2" seed="20" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .11"/></feComponentTransfer>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="soft-s" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="11"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#3c2a1d" flood-opacity=".26"/>
    </filter>
    <filter id="shadow-lg" x="-40%" y="-40%" width="190%" height="200%">
      <feDropShadow dx="0" dy="28" stdDeviation="26" flood-color="#312116" flood-opacity=".3"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>


<linearGradient id="duskMacro" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#252d25"/><stop offset=".46" stop-color="#57624f"/><stop offset="1" stop-color="#b79770"/></linearGradient>
<linearGradient id="ceramicBig" x1="0" y1="0" x2=".65" y2="1"><stop stop-color="#f1ebe0"/><stop offset=".55" stop-color="#ddd5c6"/><stop offset="1" stop-color="#b9b1a0"/></linearGradient>
<radialGradient id="water" cx=".42" cy=".38" r=".7"><stop stop-color="#778b7d"/><stop offset=".55" stop-color="#4e6257"/><stop offset="1" stop-color="#304138"/></radialGradient>
<pattern id="ceramicGrain" width="28" height="24" patternUnits="userSpaceOnUse">
  <circle cx="6" cy="7" r="1" fill="#5b5446" opacity=".09"/>
  <path d="M0 16 C8 12 16 18 28 12" stroke="#fff8ea" stroke-opacity=".12" stroke-width="1.2" fill="none"/>
</pattern>

</defs>
<rect width="1200" height="900" fill="url(#bg)"/>
<rect width="1200" height="900" fill="url(#light)"/>

<rect width="1200" height="900" fill="url(#duskMacro)"/>
<ellipse cx="1010" cy="190" rx="360" ry="320" fill="#eab86d" opacity=".21" filter="url(#glow)"/>
<path d="M0 0 L570 0 L240 900 L0 900Z" fill="#fff0d5" opacity=".13" filter="url(#soft-s)"/>
<!-- open lid leaning at right -->
<g transform="translate(750,52) rotate(20)" filter="url(#shadow-lg)">
  <ellipse cx="196" cy="156" rx="206" ry="74" fill="#b1885b" stroke="#5b4630" stroke-opacity=".42" stroke-width="3"/>
  <ellipse cx="196" cy="144" rx="194" ry="66" fill="#d0a976"/>
  <ellipse cx="196" cy="140" rx="152" ry="48" fill="#8d6b44"/>
  <path d="M54 150 C130 106 252 104 338 140" fill="none" stroke="#f2ddb4" stroke-opacity=".25" stroke-width="6"/>
  <circle cx="202" cy="50" r="35" fill="#6f5437" stroke="#483621" stroke-width="2"/>
  <circle cx="192" cy="38" r="10" fill="#d2ac7b" opacity=".34"/>
</g>
<!-- main body close-up -->
<g transform="translate(-20,330)" filter="url(#shadow-lg)">
  <ellipse cx="540" cy="102" rx="528" ry="126" fill="#b7ae9b" opacity=".36"/>
  <path d="M56 88 C168 -16 896 -20 1026 88 L1088 486 C918 580 190 580 12 486Z" fill="url(#ceramicBig)" stroke="#736c5b" stroke-opacity=".38" stroke-width="3"/>
  <ellipse cx="548" cy="74" rx="472" ry="126" fill="#b2a894"/>
  <ellipse cx="548" cy="68" rx="436" ry="105" fill="#5b523f"/>
  <ellipse cx="548" cy="70" rx="404" ry="89" fill="url(#water)"/>
  <ellipse cx="548" cy="73" rx="272" ry="59" fill="#7e8d7b" opacity=".62"/>
  <ellipse cx="548" cy="74" rx="240" ry="49" fill="#3b4d42" opacity=".5"/>
  <circle cx="548" cy="75" r="108" fill="#48594b"/>
  <g stroke="#9fa89a" stroke-width="2" opacity=".4">
    <circle cx="548" cy="75" r="82"/><circle cx="548" cy="75" r="56"/><path d="M466 75 H630 M548 -7 V157 M490 17 L606 133 M606 17 L490 133"/>
  </g>
  <circle cx="548" cy="75" r="34" fill="#617161"/>
  <circle cx="548" cy="75" r="13" fill="#c1b696"/>
  <g fill="none" stroke="#e6ecdf" stroke-opacity=".24">
    <ellipse cx="548" cy="74" rx="342" ry="72"/>
    <ellipse cx="548" cy="76" rx="222" ry="48"/>
  </g>
  <path d="M98 92 C232 14 842 8 1010 94" fill="none" stroke="#f5eee0" stroke-opacity=".26" stroke-width="5"/>
  <path d="M52 322 C190 370 854 378 1040 318" fill="none" stroke="#8f8776" stroke-opacity=".25" stroke-width="4"/>
  <path d="M1028 206 C1006 268 996 350 998 426" fill="none" stroke="#f1e7d6" stroke-opacity=".18" stroke-width="12" stroke-linecap="round"/>
  <circle cx="962" cy="252" r="6" fill="#8d8573" opacity=".5"/>
  <circle cx="960" cy="280" r="4" fill="#8d8573" opacity=".35"/>
  <!-- droplets on rim -->
  <g fill="#e7ecdf" opacity=".45">
    <circle cx="294" cy="66" r="4"/><circle cx="344" cy="16" r="2.4"/><circle cx="782" cy="34" r="3"/><circle cx="866" cy="92" r="2"/>
  </g>
</g>
<!-- mist curls -->
<g opacity=".58" fill="none" stroke="#f5ecdd" stroke-linecap="round">
  <path d="M520 304 C472 228 552 184 490 116 C444 66 494 28 462 -12" stroke-width="16"/>
  <path d="M590 298 C554 240 604 200 566 150 C536 110 566 76 544 42" stroke-width="10"/>
  <path d="M650 306 C630 264 660 236 640 202" stroke-width="6"/>
  <path d="M700 290 C684 252 710 226 694 194" stroke-width="4"/>
</g>
<g fill="#e7e1d4" opacity=".28">
  <circle cx="480" cy="216" r="3"/><circle cx="574" cy="128" r="2"/><circle cx="624" cy="198" r="2.4"/><circle cx="512" cy="88" r="1.6"/>
</g>
<g transform="translate(54,760) rotate(4)">
  <path d="M0 0 H358" stroke="#4b3b2b" stroke-width="4"/>
  <path d="M18 0 C142 20 268 16 340 -2" stroke="#e8d6b7" stroke-opacity=".2" stroke-width="4" fill="none"/>
</g>
<g stroke="#f6e8d2" stroke-width="2" opacity=".14" fill="none">
  <path d="M120 128 C246 92 376 98 490 130 M848 816 C956 790 1050 798 1138 824"/>
</g>
<rect width="1200" height="900" fill="url(#ceramicGrain)" opacity=".6"/>
<rect width="1200" height="900" fill="url(#vignette)" opacity="0.54"/>
<rect width="1200" height="900" filter="url(#grain)" opacity="0.44"/>
</svg>
