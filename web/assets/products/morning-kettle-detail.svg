<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e6cfb7"/><stop offset="1" stop-color="#a25a3e"/></linearGradient>
  <radialGradient id="glow" cx="50%" cy="32%" r="70%"><stop stop-color="#fff7e8" stop-opacity=".95"/><stop offset="1" stop-color="#fff7e8" stop-opacity="0"/></radialGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
  <filter id="shadow"><feDropShadow dx="0" dy="26" stdDeviation="22" flood-color="#5b3c25" flood-opacity=".23"/></filter>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .09"/></feComponentTransfer></filter>
</defs>
<rect width="1200" height="900" fill="url(#bg)"/>
<ellipse cx="600" cy="300" rx="620" ry="430" fill="url(#glow)"/>

<g transform="translate(100,60)">
  <g filter="url(#shadow)">
    <path d="M110 600 C90 460 200 290 420 260 C600 235 790 300 850 430 C900 530 870 610 790 670 L210 710 C150 700 118 660 110 600Z" fill="#c26043"/>
    <path d="M300 320 C450 260 650 280 770 360" stroke="#e0a37c" stroke-width="10" fill="none" opacity=".5"/>
    <path d="M850 400 C950 360 1020 310 1060 250" stroke="#b6543a" stroke-width="40" fill="none" stroke-linecap="round"/>
    <ellipse cx="450" cy="290" rx="175" ry="45" fill="#c78e66" opacity=".6"/>
    <path d="M180 500 C300 450 450 475 600 520" stroke="#f1d4b8" stroke-width="3" fill="none" opacity=".4"/>
  </g>
</g>
<g opacity=".7">
  <path d="M870 160 C830 220 845 290 890 330" stroke="#fff2df" stroke-width="8" fill="none" stroke-linecap="round"/>
  <circle cx="1010" cy="620" r="100" fill="#d4b483" opacity=".18"/>
</g>

<rect width="1200" height="900" filter="url(#grain)" opacity=".5"/>
</svg>
