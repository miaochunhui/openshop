<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="art-title art-desc">
<title id="art-title">珐琅手冲壶细节插画</title>
<desc id="art-desc">鹅颈壶嘴与珐琅表面的近景，壶口挂着将落未落的水珠，旁边是木质手柄与陶杯。</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2=".72" y2="1">
      <stop offset="0" stop-color="#d8bf9e"/><stop offset="1" stop-color="#876342"/>
    </linearGradient>
    <radialGradient id="light" gradientUnits="userSpaceOnUse" cx="270" cy="170" r="760">
      <stop offset="0" stop-color="#fff7e7" stop-opacity=".82"/>
      <stop offset=".52" stop-color="#fff5e3" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff5e3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" gradientUnits="userSpaceOnUse" cx="600" cy="410" r="760">
      <stop offset=".55" stop-color="#2d2117" stop-opacity="0"/>
      <stop offset="1" stop-color="#2d2117" stop-opacity=".24"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="2" seed="8" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .11"/></feComponentTransfer>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="soft-s" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="11"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#3c2a1d" flood-opacity=".26"/>
    </filter>
    <filter id="shadow-lg" x="-40%" y="-40%" width="190%" height="200%">
      <feDropShadow dx="0" dy="28" stdDeviation="26" flood-color="#312116" flood-opacity=".3"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>


<linearGradient id="macroBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e7d3b8"/><stop offset=".48" stop-color="#c4a47e"/><stop offset="1" stop-color="#7b5a3e"/></linearGradient>
<linearGradient id="enamelMacro" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#ce6f50"/><stop offset=".45" stop-color="#b35239"/><stop offset="1" stop-color="#7f3424"/></linearGradient>
<pattern id="enamelSpeckle" width="22" height="22" patternUnits="userSpaceOnUse">
  <circle cx="5" cy="6" r="1" fill="#fff2d9" opacity=".18"/>
  <circle cx="14" cy="16" r="1.4" fill="#59291d" opacity=".1"/>
  <path d="M1 13 C5 10 8 14 12 12" stroke="#f6c3a4" stroke-opacity=".13" stroke-width="1" fill="none"/>
</pattern>

</defs>
<rect width="1200" height="900" fill="url(#bg)"/>
<rect width="1200" height="900" fill="url(#light)"/>

<rect width="1200" height="900" fill="url(#macroBg)"/>
<path d="M0 0 L500 0 L180 900 L0 900Z" fill="#fff3db" opacity=".13" filter="url(#soft-s)"/>
<g transform="rotate(-5 600 450)" filter="url(#shadow-lg)">
  <path d="M-80 338 C124 268 366 280 600 322 C842 364 1022 440 1120 540 L1120 900 L-80 900Z" fill="url(#enamelMacro)" stroke="#6e3022" stroke-opacity=".45" stroke-width="3"/>
  <path d="M-20 390 C200 330 432 344 652 382" fill="none" stroke="#f9c7a5" stroke-opacity=".32" stroke-width="13" stroke-linecap="round"/>
  <path d="M840 400 C940 394 1008 368 1066 300 C1086 276 1118 282 1112 314 C1076 424 966 476 858 470" fill="none" stroke="#b95038" stroke-width="96" stroke-linecap="round"/>
  <path d="M860 366 C944 354 998 328 1046 274" fill="none" stroke="#f8c9aa" stroke-opacity=".28" stroke-width="15" stroke-linecap="round"/>
  <path d="M1092 308 C1118 304 1120 330 1102 346" fill="none" stroke="#743125" stroke-width="12" stroke-linecap="round"/>
  <ellipse cx="1102" cy="354" rx="18" ry="8" fill="#eec09f" opacity=".55" filter="url(#soft-s)"/>
  <path d="M1088 368 C1086 396 1070 416 1044 430 C1066 400 1066 382 1070 364Z" fill="#f6e1c9" opacity=".55"/>
  <path d="M122 590 C302 652 654 692 1000 622" fill="none" stroke="#6a2d1e" stroke-opacity=".32" stroke-width="5"/>
  <path d="M-40 690 C180 740 410 740 616 700" fill="none" stroke="#f6dcc1" stroke-opacity=".16" stroke-width="3"/>
  <path d="M1024 560 C980 604 920 630 850 638" fill="none" stroke="#6e3021" stroke-opacity=".3" stroke-width="3" stroke-dasharray="3 10"/>
</g>
<g transform="translate(886,646) rotate(6)">
  <path d="M0 0 H216 L196 124 C144 140 64 138 18 122Z" fill="#d8c8b2" opacity=".7"/>
  <ellipse cx="108" cy="3" rx="108" ry="20" fill="#eedfca" opacity=".8"/>
  <ellipse cx="108" cy="5" rx="80" ry="12" fill="#744936" opacity=".85"/>
</g>
<g opacity=".58" fill="none" stroke="#fff5e5" stroke-linecap="round">
  <path d="M280 260 C246 208 280 166 254 116" stroke-width="10"/>
  <path d="M332 248 C308 200 330 168 306 128" stroke-width="6"/>
  <path d="M1060 500 C1024 454 1040 414 1016 380" stroke-width="7"/>
</g>
<g fill="#f9ead5" opacity=".32">
  <circle cx="430" cy="230" r="4"/><circle cx="470" cy="204" r="2.4"/><circle cx="360" cy="300" r="2.8"/><circle cx="986" cy="210" r="3"/>
</g>
<g stroke="#fff5e7" stroke-width="2" opacity=".18" fill="none">
  <path d="M76 740 C230 694 360 702 478 736 M820 742 C954 716 1068 724 1152 750"/>
</g>
<rect width="1200" height="900" fill="url(#enamelSpeckle)" opacity=".6"/>
<rect width="1200" height="900" fill="url(#vignette)" opacity="0.5"/>
<rect width="1200" height="900" filter="url(#grain)" opacity="0.48"/>
</svg>
