<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="art-title art-desc">
<title id="art-title">慢早珐琅手冲壶清晨插画</title>
<desc id="art-desc">清晨厨房里的一把砖橙色珐琅手冲壶，细长壶嘴与蒸腾热气旁放着咖啡杯与亚麻餐巾。</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2=".72" y2="1">
      <stop offset="0" stop-color="#f0e4d2"/><stop offset="1" stop-color="#d8bfa1"/>
    </linearGradient>
    <radialGradient id="light" gradientUnits="userSpaceOnUse" cx="250" cy="180" r="760">
      <stop offset="0" stop-color="#fff7e7" stop-opacity=".82"/>
      <stop offset=".52" stop-color="#fff5e3" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff5e3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" gradientUnits="userSpaceOnUse" cx="600" cy="410" r="760">
      <stop offset=".55" stop-color="#2d2117" stop-opacity="0"/>
      <stop offset="1" stop-color="#2d2117" stop-opacity=".24"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="2" seed="33" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .11"/></feComponentTransfer>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="soft-s" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="11"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#3c2a1d" flood-opacity=".26"/>
    </filter>
    <filter id="shadow-lg" x="-40%" y="-40%" width="190%" height="200%">
      <feDropShadow dx="0" dy="28" stdDeviation="26" flood-color="#312116" flood-opacity=".3"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>


<linearGradient id="counter" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#c2a17d"/><stop offset="1" stop-color="#9b7655"/></linearGradient>
<linearGradient id="tileWall" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1e4d1"/><stop offset="1" stop-color="#e2cfb8"/></linearGradient>
<linearGradient id="enamel" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#ca6548"/><stop offset=".5" stop-color="#b45038"/><stop offset="1" stop-color="#8c3928"/></linearGradient>
<linearGradient id="linen" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#f2e8d8"/><stop offset="1" stop-color="#dfcfba"/></linearGradient>
<pattern id="tileGrain" width="26" height="26" patternUnits="userSpaceOnUse">
  <path d="M3 7 C8 3 14 10 23 5" stroke="#fff8e9" stroke-opacity=".17" stroke-width="1.2" fill="none"/>
  <circle cx="18" cy="19" r="1" fill="#917c62" opacity=".08"/>
</pattern>

</defs>
<rect width="1200" height="900" fill="url(#bg)"/>
<rect width="1200" height="900" fill="url(#light)"/>

<path d="M0 556 H1200 V900 H0Z" fill="url(#counter)"/>
<path d="M0 556 H1200" stroke="#795c3d" stroke-opacity=".35" stroke-width="3"/>
<path d="M0 0 H1200 V556 H0Z" fill="url(#tileWall)" opacity=".28"/>
<g stroke="#b8a58d" stroke-opacity=".28" stroke-width="2">
  <path d="M0 120 H1200 M0 238 H1200 M0 356 H1200 M0 474 H1200 M154 0 V556 M338 0 V556 M522 0 V556 M706 0 V556 M890 0 V556 M1074 0 V556"/>
</g>
<path d="M0 0 L410 0 L140 900 L0 900Z" fill="#fff4df" opacity=".13" filter="url(#soft-s)"/>
<path d="M436 0 L552 0 L302 900 L214 900Z" fill="#fff2da" opacity=".09"/>
<g transform="translate(58,52)">
  <rect x="0" y="0" width="250" height="364" rx="4" fill="#eee0ca" stroke="#7e6a52" stroke-opacity=".45" stroke-width="3"/>
  <rect x="14" y="14" width="222" height="336" fill="#d9c7ac"/>
  <path d="M14 236 C80 204 158 220 236 190 L236 350 L14 350Z" fill="#aeb59a" opacity=".45"/>
  <path d="M125 14 V350 M14 185 H236" stroke="#7b6b57" stroke-opacity=".43" stroke-width="6"/>
  <path d="M48 342 C80 300 90 266 78 240 M186 340 C206 300 212 268 198 242" stroke="#586146" stroke-opacity=".45" stroke-width="4" fill="none"/>
</g>
<g transform="translate(900,60)">
  <path d="M0 172 H262" stroke="#6e5a43" stroke-width="8"/>
  <path d="M22 172 V184 M224 172 V184" stroke="#6e5a43" stroke-width="5"/>
  <g transform="translate(22,92)">
    <path d="M0 26 H54 L48 80 C30 86 16 84 4 78Z" fill="#cfbfaa" stroke="#7a6853" stroke-opacity=".3" stroke-width="2"/>
    <ellipse cx="27" cy="26" rx="27" ry="7" fill="#ab9172"/>
    <path d="M18 0 C18 10 36 10 36 0" stroke="#6f5b43" stroke-width="2.4" fill="none"/>
  </g>
  <g transform="translate(120,64)">
    <path d="M0 38 H76 L68 88 H8Z" fill="#d8c8b3" stroke="#7f6b54" stroke-opacity=".3" stroke-width="2"/>
    <path d="M10 38 C18 20 58 20 66 38" fill="none" stroke="#9f896c" stroke-width="2"/>
  </g>
</g>
<ellipse cx="620" cy="668" rx="390" ry="45" fill="#4d331f" opacity=".2" filter="url(#soft)"/>
<g transform="translate(146,580) rotate(-2)">
  <path d="M0 0 H802 L840 208 C560 242 240 242 32 204Z" fill="url(#linen)" opacity=".7"/>
  <path d="M38 34 C280 54 534 50 790 24 M52 104 C302 130 558 126 814 92 M28 172 C284 200 572 194 838 160" fill="none" stroke="#b39c7d" stroke-opacity=".24" stroke-width="2"/>
</g>

<!-- kettle -->
<g filter="url(#shadow-lg)">
  <path d="M512 432 C512 356 574 301 654 301 C742 301 810 358 818 440 C824 500 800 576 746 612 L542 612 C498 574 494 494 512 432Z" fill="url(#enamel)" stroke="#7d3d2b" stroke-opacity=".4" stroke-width="3"/>
  <path d="M526 450 C548 390 598 347 656 340" fill="none" stroke="#f7c6a6" stroke-opacity=".36" stroke-width="9" stroke-linecap="round"/>
  <path d="M558 584 C610 606 694 606 742 580" fill="none" stroke="#702f20" stroke-opacity=".3" stroke-width="4"/>
  <ellipse cx="654" cy="421" rx="148" ry="33" fill="#d6a07d"/>
  <ellipse cx="654" cy="421" rx="124" ry="23" fill="#8d4b35"/>
  <path d="M588 417 C604 400 702 394 724 413 C710 431 612 438 588 417Z" fill="#dbb6a0" opacity=".7"/>
  <path d="M650 389 C628 362 638 338 664 328" fill="none" stroke="#503728" stroke-width="11" stroke-linecap="round"/>
  <ellipse cx="664" cy="326" rx="24" ry="12" fill="#6b4b32"/>
  <path d="M740 478 C824 455 866 410 896 356 C906 337 934 334 940 353 C918 440 844 508 754 536" fill="none" stroke="#a84832" stroke-width="33" stroke-linecap="round"/>
  <path d="M748 470 C820 446 856 410 882 365" fill="none" stroke="#ee9d7f" stroke-opacity=".28" stroke-width="5" stroke-linecap="round"/>
  <path d="M938 352 C956 350 960 362 944 376" fill="none" stroke="#7f3827" stroke-width="8" stroke-linecap="round"/>
  <path d="M520 416 C474 382 430 370 382 370 C446 398 456 462 414 506 C454 499 494 481 526 462" fill="none" stroke="#58402c" stroke-width="21" stroke-linecap="round"/>
  <path d="M386 372 C420 378 442 400 450 430" fill="none" stroke="#a27752" stroke-opacity=".4" stroke-width="5" stroke-linecap="round"/>
  <path d="M520 610 C594 626 690 624 756 606" stroke="#6d2e20" stroke-width="4" stroke-dasharray="2 9" opacity=".4" fill="none"/>
  <circle cx="810" cy="472" r="7" fill="#6a2e20" opacity=".46"/>
</g>
<g opacity=".48" fill="none" stroke="#fff4e2" stroke-linecap="round">
  <path d="M912 292 C888 242 918 206 896 164" stroke-width="9"/>
  <path d="M950 302 C934 262 954 228 936 198" stroke-width="5"/>
  <path d="M654 288 C624 250 652 218 632 184" stroke-width="7"/>
</g>
<g transform="translate(842,586)" filter="url(#shadow)">
  <path d="M0 22 H124 L110 114 C78 128 32 126 8 112Z" fill="#dccbb3" stroke="#73604b" stroke-opacity=".35" stroke-width="2"/>
  <ellipse cx="62" cy="24" rx="62" ry="13" fill="#f2e6d4"/>
  <ellipse cx="62" cy="25" rx="46" ry="9" fill="#684332"/>
  <path d="M112 46 C144 44 146 82 112 92" stroke="#dccbb3" stroke-width="8" fill="none"/>
  <path d="M32 18 C40 0 56 -4 68 8 C50 14 52 20 44 30" fill="#f8ead3" opacity=".24" filter="url(#soft-s)"/>
</g>
<g transform="translate(1080,612)">
  <path d="M0 0 C14 62 -6 132 8 210" stroke="#62553f" stroke-width="4" fill="none"/>
  <ellipse cx="0" cy="50" rx="36" ry="10" transform="rotate(-24 0 50)" fill="#737a5d"/>
  <ellipse cx="4" cy="132" rx="33" ry="9" transform="rotate(28 4 132)" fill="#858b6b"/>
</g>
<circle cx="180" cy="300" r="42" fill="#dcc7aa" opacity=".5"/>
<g fill="#5b4632" opacity=".7">
  <ellipse cx="356" cy="530" rx="12" ry="8" transform="rotate(-20 356 530)"/>
  <ellipse cx="388" cy="542" rx="10" ry="7" transform="rotate(18 388 542)"/>
  <ellipse cx="330" cy="552" rx="11" ry="7" transform="rotate(32 330 552)"/>
</g>
<rect width="1200" height="900" fill="url(#tileGrain)" opacity=".35"/>
<rect width="1200" height="900" fill="url(#vignette)" opacity="0.52"/>
<rect width="1200" height="900" filter="url(#grain)" opacity="0.46"/>
</svg>
