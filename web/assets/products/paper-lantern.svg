<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="art-title art-desc">
<title id="art-title">薄暮纸罩台灯插画</title>
<desc id="art-desc">深色墙面前的一盏手工皱纸台灯，暖光落在搭着书的木桌上，旁边有陶杯与枝影。</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2=".72" y2="1">
      <stop offset="0" stop-color="#e6d5c0"/><stop offset="1" stop-color="#a98a6b"/>
    </linearGradient>
    <radialGradient id="light" gradientUnits="userSpaceOnUse" cx="230" cy="230" r="760">
      <stop offset="0" stop-color="#fff7e7" stop-opacity=".82"/>
      <stop offset=".52" stop-color="#fff5e3" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff5e3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" gradientUnits="userSpaceOnUse" cx="600" cy="410" r="760">
      <stop offset=".55" stop-color="#2d2117" stop-opacity="0"/>
      <stop offset="1" stop-color="#2d2117" stop-opacity=".24"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="2" seed="19" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .11"/></feComponentTransfer>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="soft-s" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="11"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#3c2a1d" flood-opacity=".26"/>
    </filter>
    <filter id="shadow-lg" x="-40%" y="-40%" width="190%" height="200%">
      <feDropShadow dx="0" dy="28" stdDeviation="26" flood-color="#312116" flood-opacity=".3"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>


<linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#c4a986"/><stop offset="1" stop-color="#9f8264"/></linearGradient>
<linearGradient id="consoleWood" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a17f5b"/><stop offset="1" stop-color="#886949"/></linearGradient>
<linearGradient id="woodBase" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8b6b4e"/><stop offset="1" stop-color="#664c36"/></linearGradient>
<radialGradient id="paperGlow" cx=".48" cy=".6" r=".72">
  <stop stop-color="#fff3d4"/><stop offset=".45" stop-color="#f3dbac"/><stop offset=".85" stop-color="#d7b57f"/><stop offset="1" stop-color="#b99360"/>
</radialGradient>
<pattern id="washi" width="31" height="26" patternUnits="userSpaceOnUse">
  <path d="M2 8 C8 4 14 11 23 5 M8 20 C16 15 24 21 30 18" stroke="#fff7e7" stroke-opacity=".23" stroke-width="1.1" fill="none"/>
  <path d="M5 2 C7 8 4 12 6 17" stroke="#9c7a57" stroke-opacity=".11" stroke-width="1" fill="none"/>
</pattern>

</defs>
