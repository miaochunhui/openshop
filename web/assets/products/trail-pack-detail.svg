    <path d="M270 420 C400 360 590 380 760 440" stroke="#d6c59a" stroke-width="10" fill="none" stroke-dasharray="5 18" opacity=".7"/>
    <rect x="300" y="510" width="340" height="140" rx="40" fill="#51613b"/>
    <path d="M350 580 H580" stroke="#a8aa74" stroke-width="8" stroke-linecap="round"/>
    <path d="M240 500 C150 580 180 700 300 740" stroke="#39462d" stroke-width="45" fill="none"/>
  </g>
</g>
<path d="M930 150 C850 220 840 330 900 430 C960 330 950 220 930 150Z" fill="#efe1c4" opacity=".45"/>
<circle cx="1010" cy="700" r="140" fill="#5b6842" opacity=".4"/>

